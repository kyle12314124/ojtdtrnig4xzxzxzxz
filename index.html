<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d9dfd1" />
    <script>
      // Apply the saved theme before first paint (default: light canvas, dark cards).
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('dtr.theme')
        } catch (error) {
          stored = null
        }
        var mode = stored === 'dim' ? 'dim' : 'light'
        document.documentElement.dataset.theme = mode
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', mode === 'dim' ? '#141814' : '#d9dfd1')
      })()
    </script>
    <meta
      name="description"
      content="Secure daily time record management: attendance tracking, DTR reports, and correction workflows."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DTR System</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
