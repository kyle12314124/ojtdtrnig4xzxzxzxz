<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141814" />
    <script>
      // Apply the saved theme before first paint (default: soft dim).
      ;(function () {
        try {
          var stored = localStorage.getItem('dtr.theme')
          document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dim'
        } catch (error) {
          document.documentElement.dataset.theme = 'dim'
        }
      })()
    </script>
    <meta
      name="description"
      content="Secure daily time record management: attendance tracking, DTR reports, and correction workflows."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DTR System</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
